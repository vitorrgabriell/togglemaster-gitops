apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: togglemaster-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: togglemaster.rules
      interval: 30s
      rules:
        # Self-healing trigger: deployment sem replicas disponíveis
        - alert: ServiceUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="tech-challenge",
              deployment=~".*-service"
            } == 0
          for: 30s
          labels:
            severity: critical
            action: restart
            service: '{{ $labels.deployment }}'
          annotations:
            summary: "Service {{ $labels.deployment }} sem replicas disponíveis"
            description: |
              Deployment {{ $labels.deployment }} no namespace {{ $labels.namespace }}
              está com 0 replicas disponíveis há mais de 30s.
              Self-healing automático será acionado via GitHub Actions.

        # Alerta complementar: latência alta (apenas notifica, sem self-heal)
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, exported_job) (
                rate(togglemaster_http_server_duration_milliseconds_bucket[5m])
              )
            ) > 1000
          for: 2m
          labels:
            severity: warning
            service: '{{ $labels.exported_job }}'
          annotations:
            summary: "Latência p95 alta em {{ $labels.exported_job }}"
            description: "p95 acima de 1000ms nos últimos 5min."

        # Alerta de pods em CrashLoopBackOff (notifica, sem self-heal automático)
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="tech-challenge"}[5m]) > 0
          for: 2m
          labels:
            severity: warning
            service: '{{ $labels.pod }}'
          annotations:
            summary: "Pod {{ $labels.pod }} em CrashLoopBackOff"
            description: "Container restartando repetidamente no namespace tech-challenge."
