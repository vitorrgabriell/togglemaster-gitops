apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: togglemaster-alerts
  namespace: monitoring
  labels:
    alertmanagerConfig: togglemaster
spec:
  receivers:
    - name: null-receiver

    - name: critical-receiver
      pagerdutyConfigs:
        - class: '{{ .CommonLabels.service }}'
          description: '{{ .CommonAnnotations.summary }}'
          routingKey:
            key: integration-key
            name: pagerduty-secret
          severity: critical

    - name: discord-receiver
      discordConfigs:
        - apiURL:
            key: webhook-url
            name: discord-webhook-secret
          title: "🚨 {{ .CommonLabels.alertname }}"
          message: |
            **Service:** {{ .CommonLabels.service }}
            **Severity:** {{ .CommonLabels.severity }}
            **Summary:** {{ .CommonAnnotations.summary }}
            **Description:** {{ .CommonAnnotations.description }}
            {{ range .Alerts }}
            **Started:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}

    - name: self-healing-receiver
      webhookConfigs:
        - url: http://alert-bridge.monitoring.svc.cluster.local:8080/webhook
          sendResolved: false

  route:
    groupBy: ['alertname', 'service']
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 12h
    receiver: discord-receiver
    routes:
      - matchers:
          - name: alertname
            value: KubeSchedulerDown
        receiver: null-receiver
        continue: false

      - matchers:
          - name: alertname
            value: KubeControllerManagerDown
        receiver: null-receiver
        continue: false

      - matchers:
          - name: alertname
            value: KubePodCrashLooping
          - name: namespace
            value: argocd
        receiver: null-receiver
        continue: false

      - matchers:
          - name: severity
            value: critical
        receiver: critical-receiver
        continue: true

      - matchers:
          - name: action
            value: restart
        receiver: self-healing-receiver
        continue: true
